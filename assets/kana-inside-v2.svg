<svg xmlns="http://www.w3.org/2000/svg" width="693" height="980" viewBox="0 0 693 980" role="img" aria-labelledby="title desc">
  <title id="title">Kana Starter Workbook practice page</title><desc id="desc">A polished hiragana tracing lesson with clear instructions.</desc>
  <rect width="693" height="980" fill="#fcfbf8"/><rect width="693" height="18" fill="#b4563a"/>
  <g font-family="Inter, Avenir, Helvetica Neue, Noto Sans JP, sans-serif">
    <text x="58" y="72" font-size="12" font-weight="800" letter-spacing="2.1" fill="#8f402d">HIRAGANA · LESSON 01</text><rect x="570" y="45" width="65" height="31" rx="15.5" fill="#e9eee7"/><text x="602.5" y="65.5" text-anchor="middle" font-size="12" font-weight="800" fill="#303a34">10 MIN</text>
    <text x="58" y="130" font-size="38" font-weight="800" letter-spacing="-1.4" fill="#272c29">Meet the vowel sounds</text><text x="58" y="166" font-size="16" fill="#626862">Say each sound aloud. Trace slowly, then write it once by yourself.</text>
    <rect x="58" y="204" width="577" height="74" rx="14" fill="#303a34"/><circle cx="94" cy="241" r="20" fill="#d7b08b"/><text x="94" y="247" text-anchor="middle" font-size="18" font-weight="850" fill="#272c29">あ</text><text x="127" y="232" font-size="14" font-weight="800" fill="#fff">STUDY TIP</text><text x="127" y="254" font-size="13" fill="#dfe7e1">Keep your strokes relaxed. Accuracy comes before speed.</text>
    <g transform="translate(58 312)"><rect width="577" height="50" rx="8" fill="#e9eee7"/><text x="18" y="31" font-size="11" font-weight="850" letter-spacing="1.2" fill="#526258">KANA</text><text x="102" y="31" font-size="11" font-weight="850" letter-spacing="1.2" fill="#526258">SOUND</text><text x="196" y="31" font-size="11" font-weight="850" letter-spacing="1.2" fill="#526258">TRACE</text><text x="388" y="31" font-size="11" font-weight="850" letter-spacing="1.2" fill="#526258">YOUR TURN</text>
      <g fill="#272c29" font-size="24" font-weight="650"><text x="24" y="100">あ</text><text x="24" y="168">い</text><text x="24" y="236">う</text><text x="24" y="304">え</text><text x="24" y="372">お</text></g><g fill="#8f402d" font-size="16" font-weight="800"><text x="112" y="98">a</text><text x="112" y="166">i</text><text x="112" y="234">u</text><text x="112" y="302">e</text><text x="112" y="370">o</text></g><g fill="#c7c2b9" font-size="29"><text x="196" y="100">あ あ あ</text><text x="196" y="168">い い い</text><text x="196" y="236">う う う</text><text x="196" y="304">え え え</text><text x="196" y="372">お お お</text></g>
      <g stroke="#8f918c" stroke-width="1.2"><line x1="388" y1="105" x2="548" y2="105"/><line x1="388" y1="173" x2="548" y2="173"/><line x1="388" y1="241" x2="548" y2="241"/><line x1="388" y1="309" x2="548" y2="309"/><line x1="388" y1="377" x2="548" y2="377"/></g><g stroke="#ded8ce"><line x1="0" y1="118" x2="577" y2="118"/><line x1="0" y1="186" x2="577" y2="186"/><line x1="0" y1="254" x2="577" y2="254"/><line x1="0" y1="322" x2="577" y2="322"/><line x1="0" y1="390" x2="577" y2="390"/></g>
    </g>
    <g transform="translate(58 744)"><rect width="577" height="139" rx="14" fill="#f3e4dc" stroke="#e7cbbf"/><text x="20" y="35" font-size="12" font-weight="850" letter-spacing="1.5" fill="#8f402d">QUICK CHECK</text><text x="20" y="64" font-size="15" font-weight="700" fill="#272c29">Cover the sound column. Can you read all five kana?</text><rect x="20" y="85" width="537" height="34" rx="8" fill="#fcfbf8"/><text x="36" y="107" font-size="14" fill="#626862">I can read:</text><text x="142" y="108" font-size="18" font-weight="700" fill="#272c29">あ　い　う　え　お</text><text x="524" y="108" text-anchor="end" font-size="14" fill="#626862">□ Not yet　□ Yes!</text></g>
    <line x1="58" y1="918" x2="635" y2="918" stroke="#ded8ce"/><text x="58" y="946" font-size="11" font-weight="750" letter-spacing="1" fill="#626862">NIHONGO MORUMOTTO · KANA STARTER WORKBOOK</text><text x="635" y="946" text-anchor="end" font-size="12" font-weight="850" fill="#8f402d">04</text>
  </g>
</svg>
